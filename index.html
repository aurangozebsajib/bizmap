<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BizMap - 5000+ Business Ideas</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#0A0A0A;color:#fff;padding:16px;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-weight:800;font-size:20px}
.logo span{color:#FFD60A}
.badge{background:#FFD60A;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
h1{font-size:24px;margin:10px 0}
h1 span{color:#FFD60A}
.sub{color:#888;font-size:14px;margin-bottom:20px}
.sectors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1A1A1A;border:1px solid #2A2A2A;border-radius:16px;padding:16px}
.card:hover{border-color:#FFD60A}
.card .icon{font-size:28px;margin-bottom:8px}
.card .name{font-weight:700;font-size:14px}
.card .count{color:#888;font-size:11px;margin-top:4px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0A0A0A;border-top:1px solid #1A1A1A;padding:12px;display:flex;justify-content:space-around}
.bottom button{background:none;border:none;color:#666;font-size:12px}
.bottom button.active{color:#FFD60A}
</style>
</head>
<body>
<div class="header">
<div class="logo">BizMap<span>.</span></div>
<div class="badge">5000+ Ideas</div>
</div>
<h1>Business for <span>Bangladesh</span></h1>
<p class="sub">Find → Understand → Test → Execute</p>
<div class="sectors">
<div class="card"><div class="icon">🛒</div><div class="name">Retail</div><div class="count">342 ideas</div></div>
<div class="card"><div class="icon">🌾</div><div class="name">Agriculture</div><div class="count">280 ideas</div></div>
<div class="card"><div class="icon">🐔</div><div class="name">Poultry</div><div class="count">156 ideas</div></div>
<div class="card"><div class="icon">🍔</div><div class="name">Food</div><div class="count">410 ideas</div></div>
<div class="card"><div class="icon">🏥</div><div class="name">Medical</div><div class="count">195 ideas</div></div>
<div class="card"><div class="icon">🏗️</div><div class="name">Construction</div><div class="count">230 ideas</div></div>
</div>
<div class="bottom">
<button class="active">🏠 Home</button>
<button>🔍 Search</button>
<button>⭐ Saved</button>
<button>🤖 AI</button>
<button>👤 Profile</button>
</div>
<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();
Telegram.WebApp.setHeaderColor('#0A0A0A');
</script>
</body>
</html>
